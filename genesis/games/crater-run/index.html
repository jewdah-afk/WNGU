<title>Crater Run</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* One full-screen pixel world; HUD floats over it. Dark arcade look, single theme by choice. */
  :root {
    color-scheme: dark;
    --ink: #0b0d14; --panel: #141826ee; --line: #2a3146; --text: #eef0f6; --muted: #8e97ad;
    --gold: #ffcc4d; --fuel: #ff6b4a; --nitro: #57d7ff; --good: #7be08f;
    --display: "Bungee", "Impact", system-ui, sans-serif;
    --body: "Chakra Petch", ui-monospace, Menlo, monospace;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: var(--text); font: 14px/1.35 var(--body); user-select: none; -webkit-user-select: none; }
  canvas#screen { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; }
  .hud { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; gap: 12px; pointer-events: none; }
  .stat { font-family: var(--display); font-size: 22px; text-shadow: 0 2px 0 #000a; letter-spacing: .02em; }
  .stat small { display: block; font-family: var(--body); font-size: 11px; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; text-shadow: none; }
  .bars { display: flex; flex-direction: column; gap: 5px; width: min(220px, 40vw); }
  .bar { height: 9px; background: #0008; border: 1px solid #fff3; border-radius: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; }
  .bar.fuel i { background: var(--fuel); } .bar.nitro i { background: var(--nitro); }
  .label { font-size: 10px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
  .coins { color: var(--gold); text-align: right; }
  #toast { position: fixed; left: 50%; top: 28%; transform: translateX(-50%); font-family: var(--display); font-size: clamp(22px, 5vw, 44px); color: var(--gold); text-shadow: 0 3px 0 #000b; pointer-events: none; opacity: 0; transition: opacity .25s; text-align: center; }
  #toast.on { opacity: 1; }
  .pads { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; }
  .pad { pointer-events: auto; width: 92px; height: 92px; border-radius: 18px; border: 2px solid #fff3; background: #0006; color: var(--text); font: 700 13px var(--body); letter-spacing: .1em; display: grid; place-items: center; touch-action: none; }
  .pad.on { background: #fff3; }
  .pad.nitro { width: 70px; height: 70px; border-color: #57d7ff88; color: var(--nitro); }
  .menu { position: fixed; inset: 0; display: grid; place-items: center; padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: radial-gradient(ellipse at center, #0b0d1488 0%, #0b0d14dd 70%); overflow-y: auto; }
  .card { width: min(560px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; box-shadow: 0 20px 60px #000a; }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 8vw, 56px); margin: 0; line-height: 1; color: var(--gold); text-shadow: 0 4px 0 #6b3b00; text-wrap: balance; }
  .tag { color: var(--muted); margin: 6px 0 16px; }
  .run { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .run div { background: #0b0d14; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
  .run b { display: block; font-family: var(--display); font-weight: 400; font-size: 20px; font-variant-numeric: tabular-nums; }
  .ups { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .up { background: #0b0d14; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; color: var(--text); font: inherit; text-align: left; cursor: pointer; display: grid; gap: 2px; }
  .up:hover:not([disabled]) { border-color: var(--gold); }
  .up[disabled] { opacity: .45; cursor: default; }
  .up .n { font-weight: 700; } .up .l { font-size: 11px; color: var(--muted); } .up .c { color: var(--gold); font-size: 12px; }
  .pips { display: flex; gap: 2px; } .pips i { width: 10px; height: 4px; background: #2a3146; border-radius: 1px; } .pips i.f { background: var(--gold); }
  .go { margin-top: 16px; width: 100%; padding: 14px; font: 400 22px var(--display); color: #1a1200; background: var(--gold); border: 0; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 0 #8a5a00; }
  .go:active { transform: translateY(2px); box-shadow: 0 2px 0 #8a5a00; }
  .go:focus-visible, .up:focus-visible { outline: 3px solid var(--nitro); outline-offset: 2px; }
  .keys { color: var(--muted); font-size: 12px; margin-top: 10px; text-align: center; }
  .fps { position: fixed; bottom: calc(6px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); font-size: 10px; color: #fff6; pointer-events: none; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;700&display=swap">

<canvas id="screen"></canvas>
<div class="hud">
  <div class="stat" id="dist">0 m<small id="best">best 0 m</small></div>
  <div class="bars">
    <span class="label">fuel</span><div class="bar fuel"><i id="fuel"></i></div>
    <span class="label">nitro</span><div class="bar nitro"><i id="nitro"></i></div>
  </div>
  <div class="stat coins" id="coins">0<small id="speed">0 km/h</small></div>
</div>
<div id="toast"></div>
<div class="pads" id="pads" hidden>
  <button class="pad" id="brake" aria-label="brake">BRAKE</button>
  <button class="pad nitro" id="boost" aria-label="nitro">NITRO</button>
  <button class="pad" id="gas" aria-label="gas">GAS</button>
</div>
<div class="fps" id="fps"></div>
<div class="menu" id="menu">
  <div class="card">
    <h1>CRATER RUN</h1>
    <p class="tag" id="tagline">Every pixel of this world is simulated dirt, sand, snow, water, rock or lava. Dig it, blast it, drown in it.</p>
    <div class="run" id="runStats"></div>
    <div class="ups" id="ups"></div>
    <button class="go" id="go">DRIVE</button>
    <p class="keys">→ / D gas · ← / A brake · Shift nitro · R restart · on touch: pads</p>
  </div>
</div>

<script>
"use strict";
// ============================================================================
// Crater Run. A falling-sand world (every pixel a material that can move,
// burn, flow or be destroyed) + spring-suspension car physics against that
// pixel field + ray-cast 2D lighting with a day/night cycle.
// Rendered at ~400x225 into one pixel buffer per frame: the same budget a
// Roblox EditableImage + WritePixelsBuffer renderer works with.
// ============================================================================

// ---------------- materials ----------------
const AIR = 0, DIRT = 1, GRASS = 2, ROCK = 3, SAND = 4, WATER = 5, LAVA = 6, SNOW = 7, ICE = 8, LOOSE = 9, OBSIDIAN = 10, BEDROCK = 11, WOOD = 12;
const M = [];
function mat(id, o) { M[id] = Object.assign({ solid: false, powder: false, liquid: false, dig: false, mu: 0.8, col: [0, 0, 0], v: 18, glow: 0 }, o); }
mat(AIR, {});
mat(DIRT, { solid: true, dig: true, mu: 0.95, col: [112, 74, 46], v: 22 });
mat(GRASS, { solid: true, dig: true, mu: 0.95, col: [86, 150, 58], v: 26 });
mat(ROCK, { solid: true, mu: 0.8, col: [96, 98, 110], v: 20 });
mat(SAND, { solid: true, powder: true, dig: true, mu: 0.55, col: [222, 190, 120], v: 22 });
mat(WATER, { liquid: true, col: [40, 110, 200], v: 14 });
mat(LAVA, { liquid: true, col: [255, 110, 30], v: 40, glow: 1 });
mat(SNOW, { solid: true, powder: true, dig: true, mu: 0.42, col: [232, 240, 250], v: 10 });
mat(ICE, { solid: true, mu: 0.1, col: [160, 215, 240], v: 12 });
mat(LOOSE, { solid: true, powder: true, dig: true, mu: 0.6, col: [128, 88, 58], v: 26 });
mat(OBSIDIAN, { solid: true, mu: 0.7, col: [44, 34, 58], v: 14 });
mat(BEDROCK, { solid: true, mu: 0.8, col: [30, 30, 36], v: 6 });
mat(WOOD, { solid: true, dig: false, mu: 0.8, col: [150, 100, 50], v: 16 });
const SOLID = new Uint8Array(16), POWDER = new Uint8Array(16), LIQUID = new Uint8Array(16), DIG = new Uint8Array(16);
for (let i = 0; i < M.length; i++) { SOLID[i] = M[i].solid; POWDER[i] = M[i].powder; LIQUID[i] = M[i].liquid; DIG[i] = M[i].dig; }

// ---------------- noise ----------------
function h1(n) { n = (n << 13) ^ n; return ((n * (n * n * 15731 + 789221) + 1376312589) & 0x7fffffff) / 0x7fffffff; }
function h2(x, y) { return h1((x * 73856093) ^ (y * 19349663)); }
function sm(t) { return t * t * (3 - 2 * t); }
function noise1(x) { const i = Math.floor(x), f = sm(x - i); return h1(i) * (1 - f) + h1(i + 1) * f; }
function noise2(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = sm(x - ix), fy = sm(y - iy);
  const a = h2(ix, iy), b = h2(ix + 1, iy), c = h2(ix, iy + 1), d = h2(ix + 1, iy + 1);
  return (a * (1 - fx) + b * fx) * (1 - fy) + (c * (1 - fx) + d * fx) * fy;
}

// ---------------- world: chunked columns ----------------
const H = 640, CW = 128;
const chunks = new Map();
const BIOMES = ["meadow", "desert", "tundra", "volcano", "canyon"];
const BIOME_LEN = 1700;
function biomeAt(x) { if (x < 1400) return "meadow"; return BIOMES[Math.floor((x - 1400) / BIOME_LEN + 1) % BIOMES.length]; }
function surfaceY(x) {
  const amp = 22 + Math.min(130, Math.max(0, x - 300) * 0.011);
  let y = 360 + (noise1(x * 0.0042) - 0.5) * 2 * amp + (noise1(x * 0.013 + 9) - 0.5) * amp * 0.7 + (noise1(x * 0.06) - 0.5) * 6;
  if (biomeAt(x) === "canyon") y += Math.max(0, Math.sin(x * 0.006) * 70 - 25) * (noise1(x * 0.002) > 0.4 ? 1 : 0);
  if (x < 260) y = 360 + (y - 360) * Math.max(0, (x - 160) / 100);
  return y;
}
const ents = []; // pickups and crates: {k, x, y, ch, dead}

function genChunk(ci) {
  const mat = new Uint8Array(CW * H), col = new Uint8Array(CW * H);
  for (let lx = 0; lx < CW; lx++) {
    const x = ci * CW + lx, b = biomeAt(x), s = Math.round(surfaceY(x));
    const dirtDepth = 18 + Math.floor(noise1(x * 0.03) * 22);
    const sea = 372 + Math.floor((noise1(Math.floor(x / BIOME_LEN) * 3.1) - 0.5) * 30);
    for (let y = 0; y < H; y++) {
      const i = y * CW + lx;
      col[i] = (h2(x, y) * 255) | 0;
      let m = AIR;
      if (y >= H - 4) m = BEDROCK;
      else if (y >= s) {
        const d = y - s;
        if (b === "desert") m = d < 26 + dirtDepth * 0.5 ? SAND : d < 50 + dirtDepth ? DIRT : ROCK;
        else if (b === "tundra") m = d < 5 ? SNOW : d < dirtDepth ? DIRT : ROCK;
        else if (b === "volcano") m = d < 3 ? LOOSE : d < 8 + dirtDepth * 0.3 ? DIRT : (noise2(x * 0.05, y * 0.05) > 0.62 ? OBSIDIAN : ROCK);
        else if (b === "canyon") m = d < 2 ? GRASS : d < 6 ? DIRT : (Math.floor((y + noise1(x * 0.02) * 8) / 7) % 2 ? ROCK : LOOSE);
        else m = d < 2 ? GRASS : d < dirtDepth ? DIRT : ROCK;
        // caves below the crust, never in the first stretch
        if (x > 700 && d > 22 && y < H - 30 && noise2(x * 0.022, y * 0.04) > 0.7) m = AIR;
        if (b === "volcano" && d > 26 && noise2(x * 0.02 + 40, y * 0.03) > 0.74) m = LAVA;
      } else if ((b === "meadow" || b === "tundra") && x > 500 && y >= sea) m = b === "tundra" && y < sea + 2 ? ICE : WATER;
      else if (b === "volcano" && y >= sea + 34) m = LAVA;
      mat[i] = m;
    }
  }
  const c = { ci, mat, col, stamp: new Uint16Array(CW * H), x0: 0, y0: 0, x1: CW - 1, y1: H - 1, any: true };
  chunks.set(ci, c);
  // pickups: coin arcs, fuel cans, TNT crates, deterministic per chunk
  const base = ci * CW;
  if (base > 300) {
    if (h1(ci * 7 + 1) < 0.55) {
      const cx = base + 20 + h1(ci * 7 + 2) * 80, n = 5 + Math.floor(h1(ci * 7 + 3) * 4);
      for (let k = 0; k < n; k++) { const x = cx + k * 9; ents.push({ k: "coin", x, y: surfaceY(x) - 16 - Math.sin(k / (n - 1) * Math.PI) * 18, ch: ci }); }
    }
    if (ci % 9 === 4) { const x = base + 64; ents.push({ k: "fuel", x, y: surfaceY(x) - 12, ch: ci }); }
    if (h1(ci * 7 + 5) < (base > 1500 ? 0.4 : 0.15)) {
      const x = base + 30 + h1(ci * 7 + 6) * 70, sy = surfaceY(x);
      if (sy < 372) ents.push({ k: "tnt", x, y: sy - 6, ch: ci, vy: 0 });
    }
  }
  return c;
}
function chunk(ci) { return chunks.get(ci) || genChunk(ci); }
let lastC = null;
function cAt(x) { const ci = Math.floor(x / CW); if (lastC && lastC.ci === ci) return lastC; lastC = chunk(ci); return lastC; }
function getM(x, y) { x |= 0; y |= 0; if (y < 0) return AIR; if (y >= H) return BEDROCK; const c = cAt(x); return c.mat[y * CW + (x - c.ci * CW)]; }
function wake(c, lx, y) {
  if (!c.any) { c.x0 = c.x1 = lx; c.y0 = c.y1 = y; c.any = true; return; }
  if (lx < c.x0) c.x0 = lx; if (lx > c.x1) c.x1 = lx; if (y < c.y0) c.y0 = y; if (y > c.y1) c.y1 = y;
}
function wakeAt(x, y) {
  x |= 0; y |= 0;
  for (let dx = -1; dx <= 1; dx++) { const c = cAt(x + dx); const lx = x + dx - c.ci * CW; wake(c, lx, Math.max(0, y - 1)); wake(c, lx, Math.min(H - 1, y + 1)); }
}
function setM(x, y, m, colv) {
  x |= 0; y |= 0; if (y < 0 || y >= H) return;
  const c = cAt(x), i = y * CW + (x - c.ci * CW);
  c.mat[i] = m; if (colv !== undefined) c.col[i] = colv;
  wakeAt(x, y);
}
function getCol(x, y) { const c = cAt(x | 0); return c.col[(y | 0) * CW + ((x | 0) - c.ci * CW)]; }

// ---------------- cellular automaton (dirty rects per chunk) ----------------
let frame = 0;
function swap(ca, ia, cb, ib) {
  const m = ca.mat[ia]; ca.mat[ia] = cb.mat[ib]; cb.mat[ib] = m;
  const k = ca.col[ia]; ca.col[ia] = cb.col[ib]; cb.col[ib] = k;
  cb.stamp[ib] = frame & 0xffff;
}
// neighbour access that crosses chunk edges
function cell(c, lx) { if (lx < 0) return [chunk(c.ci - 1), lx + CW]; if (lx >= CW) return [chunk(c.ci + 1), lx - CW]; return [c, lx]; }
function stepCA(xMin, xMax) {
  frame++;
  const stamp = frame & 0xffff, flip = frame & 1;
  const steamOut = [];
  for (let ci = Math.floor(xMin / CW); ci <= Math.floor(xMax / CW); ci++) {
    const c = chunk(ci);
    if (!c.any) continue;
    const x0 = Math.max(0, c.x0 - 1), x1 = Math.min(CW - 1, c.x1 + 1), y0 = Math.max(0, c.y0 - 1), y1 = Math.min(H - 2, c.y1 + 1);
    c.any = false;
    for (let y = y1; y >= y0; y--) {
      for (let k = 0; k <= x1 - x0; k++) {
        const lx = flip ? x1 - k : x0 + k, i = y * CW + lx, m = c.mat[i];
        if (m === AIR || SOLID[m] && !POWDER[m]) continue;
        if (c.stamp[i] === stamp) continue;
        const below = i + CW;
        if (POWDER[m]) {
          const bm = c.mat[below];
          if (bm === AIR || LIQUID[bm]) { swap(c, i, c, below); wake(c, lx, y); wake(c, lx, y + 1); continue; }
          const dir = (h1(frame * 31 + lx * 7 + y) < 0.5) ? -1 : 1;
          for (const d of [dir, -dir]) {
            const [nc, nx] = cell(c, lx + d), j = (y + 1) * CW + nx, jm = nc.mat[j];
            // snow and loose dirt hold steeper piles than sand
            if ((jm === AIR || LIQUID[jm]) && nc.mat[y * CW + nx] !== ROCK && (m === SAND || h1(frame + i) < 0.5)) { swap(c, i, nc, j); wake(c, lx, y); wake(nc, nx, y + 1); break; }
          }
          continue;
        }
        if (LIQUID[m]) {
          if (m === LAVA && (frame % 3)) { wake(c, lx, y); continue; }
          // lava meets water: both become obsidian rock + steam
          if (m === LAVA) {
            for (const [dx, dy] of [[0, -1], [1, 0], [-1, 0], [0, 1]]) {
              const [nc, nx] = cell(c, lx + dx), j = (y + dy) * CW + nx;
              if (y + dy >= 0 && y + dy < H && nc.mat[j] === WATER) { nc.mat[j] = AIR; c.mat[i] = OBSIDIAN; steamOut.push(ci * CW + lx, y); wake(c, lx, y); break; }
            }
            if (c.mat[i] !== LAVA) continue;
          }
          const bm = c.mat[below];
          if (bm === AIR) { swap(c, i, c, below); wake(c, lx, y); wake(c, lx, y + 1); continue; }
          const dir = (h1(frame * 17 + lx * 3 + y * 5) < 0.5) ? -1 : 1;
          let moved = false;
          for (const d of [dir, -dir]) {
            const [nc, nx] = cell(c, lx + d), j = (y + 1) * CW + nx;
            if (nc.mat[j] === AIR) { swap(c, i, nc, j); wake(c, lx, y); wake(nc, nx, y + 1); moved = true; break; }
          }
          if (moved) continue;
          const spread = m === WATER ? 3 : 1;
          for (const d of [dir, -dir]) {
            let tx = lx, tc = c;
            for (let s = 1; s <= spread; s++) {
              const [nc, nx] = cell(c, lx + d * s);
              if (nc.mat[y * CW + nx] !== AIR) break;
              tc = nc; tx = nx;
            }
            if (tc !== c || tx !== lx) { swap(c, i, tc, y * CW + tx); wake(c, lx, y); wake(tc, tx, y); moved = true; break; }
          }
        }
      }
    }
  }
  for (let k = 0; k < steamOut.length; k += 2) for (let n = 0; n < 3; n++) fx.push({ x: steamOut[k], y: steamOut[k + 1], vx: (Math.random() - 0.5) * 20, vy: -20 - Math.random() * 30, life: 1.2, t: 0, kind: "steam" });
}

// ---------------- debris: pixels in flight that land back as terrain ----------------
const debris = [];
function fling(x, y, m, colv, vx, vy) {
  if (debris.length > 6000) return;
  debris.push({ x, y, vx, vy, m: (m === DIRT || m === GRASS || m === ROCK || m === OBSIDIAN) ? LOOSE : m, c: colv });
}
function stepDebris(dt) {
  for (let k = debris.length - 1; k >= 0; k--) {
    const p = debris[k];
    p.vy += 420 * dt; p.vx *= 0.995;
    const nx = p.x + p.vx * dt, ny = p.y + p.vy * dt;
    const steps = Math.ceil(Math.max(Math.abs(nx - p.x), Math.abs(ny - p.y))) || 1;
    let landed = false;
    for (let s = 1; s <= steps; s++) {
      const tx = p.x + (nx - p.x) * s / steps, ty = p.y + (ny - p.y) * s / steps;
      const tm = getM(tx, ty);
      if (tm !== AIR && !(LIQUID[tm] && p.m !== WATER)) {
        // settle in the last free cell (climb if it filled up)
        let sx = p.x + (nx - p.x) * (s - 1) / steps, sy = p.y + (ny - p.y) * (s - 1) / steps;
        for (let up = 0; up < 6 && getM(sx, sy) !== AIR && !LIQUID[getM(sx, sy)]; up++) sy -= 1;
        if (getM(sx, sy) === AIR || LIQUID[getM(sx, sy)]) setM(sx, sy, p.m, p.c);
        landed = true; break;
      }
    }
    if (landed || ny > H) { debris[k] = debris[debris.length - 1]; debris.pop(); continue; }
    p.x = nx; p.y = ny;
  }
}

// ---------------- effects & lights ----------------
const fx = [];       // smoke, sparks, flames, steam, glints
const flashes = [];  // occluded point lights {x, y, r, i, life, t, col}
let shake = 0;

function explode(x, y, R) {
  for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
    const d2 = dx * dx + dy * dy; if (d2 > R * R) continue;
    const m = getM(x + dx, y + dy); if (m === AIR || m === BEDROCK) continue;
    const d = Math.sqrt(d2) + 0.01, f = 1 - d / R;
    if (Math.random() < 0.45) fling(x + dx, y + dy, m, getCol(x + dx, y + dy), dx / d * (90 + 320 * f) + (Math.random() - 0.5) * 60, dy / d * (90 + 320 * f) - 120 * f);
    setM(x + dx, y + dy, AIR);
  }
  for (let n = 0; n < 40; n++) { const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 160; fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.5, t: 0, kind: "spark" }); }
  for (let n = 0; n < 24; n++) fx.push({ x: x + (Math.random() - 0.5) * R, y: y + (Math.random() - 0.5) * R, vx: (Math.random() - 0.5) * 30, vy: -15 - Math.random() * 25, life: 2 + Math.random(), t: 0, kind: "smoke" });
  flashes.push({ x, y, r: 150, i: 3.2, life: 0.45, t: 0, col: [1, 0.75, 0.45] });
  shake = Math.max(shake, 7);

      for (let yy = -5; yy <= 5; yy++) for (let xx = -4; xx <= 4; xx++) plot(sx + xx, sy + yy, xx === -4 || yy === -5 ? 120 : 220, 40, 40);
      for (let xx = -2; xx <= 2; xx++) plot(sx + xx, sy - 6, 200, 200, 200);
      plot(sx - 1, sy, 255, 255, 255); plot(sx + 1, sy, 255, 255, 255);
    } else if (e.k === "tnt") {
      for (let yy = -5; yy <= 5; yy++) for (let xx = -5; xx <= 5; xx++) {
        const band = yy === -1 || yy === 1 ? [240, 240, 220] : [190, 40, 30];
        plot(sx + xx, sy + yy, Math.abs(xx) === 5 || Math.abs(yy) === 5 ? 90 : band[0], Math.abs(xx) === 5 || Math.abs(yy) === 5 ? 30 : band[1], band[2] * (Math.abs(xx) === 5 || Math.abs(yy) === 5 ? 0.3 : 1));
      }
    }
  }
  // debris pixels in flight
  for (const p of debris) {
    const mt = M[p.m], v = (p.c / 255 - 0.5) * mt.v;
    plot(p.x - ox, p.y - oy, mt.col[0] + v, mt.col[1] + v, mt.col[2] + v, mt.glow, mt.glow * 0.4, 0);
  }
  // car: rotated sprite (inverse mapping), wheels with spokes
  const cc = Math.cos(car.a), cs = Math.sin(car.a);
  const ccx = car.x - ox, ccy = car.y - oy;
  for (let yy = -26; yy <= 26; yy++) for (let xx = -26; xx <= 26; xx++) {
    const lx = Math.round(xx * cc + yy * cs) + CAR_OX, ly = Math.round(-xx * cs + yy * cc) + CAR_OY;
    if (lx < 0 || ly < 0 || lx >= CAR_W || ly >= CAR_H) continue;
    const s = carSpr[ly * CAR_W + lx]; if (s < 0) continue;
    const em = carEm[ly * CAR_W + lx];
    plot(ccx + xx, ccy + yy, (s >> 16) & 255, (s >> 8) & 255, s & 255, em === 1 ? 1.5 : em === 2 ? 1.2 : 0, em === 1 ? 1.4 : 0, em === 1 ? 0.9 : 0);
  }
  for (const wh of car.wheels) {
    const [ax, ay] = rot(wh.ax, wh.ay - 3, car.a);
    // strut
    const n = 8; for (let k = 0; k <= n; k++) plot(lerp(car.x + ax, wh.x, k / n) - ox, lerp(car.y + ay, wh.y, k / n) - oy, 150, 150, 160);
    const R = wh.r;
    for (let yy = -Math.ceil(R); yy <= R; yy++) for (let xx = -Math.ceil(R); xx <= R; xx++) {
      const d = Math.hypot(xx, yy); if (d > R) continue;
      let shade = d > R - 2.2 ? 30 : d < 2 ? 200 : 120;
      if (d >= 2 && d <= R - 2.2) { const a = Math.atan2(yy, xx) - wh.ang; if (Math.abs(Math.sin(a * 2.5)) < 0.3) shade = 190; else shade = 70; }
      if (d > R - 2.2 && ((Math.atan2(yy, xx) - wh.ang) * 4 / Math.PI % 1 + 1) % 1 < 0.3) shade = 55;
      plot(wh.x - ox + xx, wh.y - oy + yy, shade, shade, shade * 1.08);
    }
  }
  // effects
  for (const f of fx) {
    const k = f.t / f.life, sx = f.x - ox, sy = f.y - oy;
    if (f.kind === "smoke" || f.kind === "steam" || f.kind === "dust") {
      const r = 1 + k * (f.kind === "dust" ? 3 : 6), a = (1 - k) * (f.kind === "steam" ? 0.5 : 0.65);
      const col = f.kind === "steam" ? [220, 225, 235] : f.kind === "dust" ? [160, 130, 100] : [70, 66, 70];
      for (let yy = -r; yy <= r; yy++) for (let xx = -r; xx <= r; xx++) {
        if (xx * xx + yy * yy > r * r) continue;
        const X = Math.round(sx + xx), Y = Math.round(sy + yy); if (X < 0 || Y < 0 || X >= VW || Y >= VH) continue;
        if (a * 16 < (BAYER[(Y & 3) * 4 + (X & 3)] / 6 + 0.5) * 16 * 0.9) continue;
        const i = Y * VW + X; albR[i] = col[0]; albG[i] = col[1]; albB[i] = col[2]; if (sky[i] < 0) sky[i] = Math.min(sky[i], -1.6);
      }
    } else if (f.kind === "spark" || f.kind === "flame") {
      const hot = 1 - k;
      plot(sx, sy, 255, 200 * hot + 40, 80 * hot, 2.2 * hot, (f.kind === "flame" ? 1.1 : 1.5) * hot, 0.3 * hot);
    } else if (f.kind === "glint") { for (const [a, b] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) plot(sx + a, sy + b, 255, 240, 150, 1.5 * (1 - k), 1.3 * (1 - k), 0.5); }
    else if (f.kind === "bubble") plot(sx, sy, 200, 230, 255);
  }

  // ---- lighting ----
  // 1. sky light: per-column transmittance computed above, softened sideways
  const N = VW * VH;
  for (let i = 0; i < N; i++) { const s = sky[i] < 0 ? -sky[i] - 1 : sky[i]; lR[i] = s; }
  for (let pass = 0; pass < 2; pass++) for (let y = 0; y < VH; y++) {
    let acc = 0; const row = y * VW, R = 3;
    for (let x = -R; x < VW; x++) {
      if (x + R < VW) acc += lR[row + x + R];
      if (x - R - 1 >= 0) acc -= lR[row + x - R - 1];
      if (x >= 0) lG[row + x] = acc / (2 * R + 1);
    }
    for (let x = 0; x < VW; x++) lR[row + x] = lG[row + x];
  }
  for (let i = 0; i < N; i++) { const s = solidMask[i] === 1 ? Math.max(lR[i], 0.32) : lR[i]; lR[i] = s * amb[0] + 0.035; lG[i] = s * amb[1] + 0.035; lB[i] = s * amb[2] + 0.05; }
  // 2. occluded point lights: headlight cone + explosions, by marching rays through the pixel field
  const night = 1 - day;
  const lights = [];
  if (night > 0.05 && !car.dead) { const [hx, hy] = rot(20, 0, car.a); lights.push({ x: car.x + hx, y: car.y + hy, dir: car.a, spread: 0.42, r: 170, i: 1.8 * night + 0.3, col: [1, 0.92, 0.7], rays: 140 }); }
  for (const f of flashes) lights.push({ x: f.x, y: f.y, dir: 0, spread: Math.PI, r: f.r, i: f.i * (1 - f.t / f.life), col: f.col, rays: 260 });
  for (const L of lights) {
    for (let k = 0; k < L.rays; k++) {
      const a = L.dir + (k / (L.rays - 1) - 0.5) * 2 * L.spread, dx = Math.cos(a), dy = Math.sin(a);
      let x = L.x, y = L.y;
      for (let s = 0; s < L.r; s++) {
        x += dx; y += dy;
        const sx = Math.round(x - ox), sy = Math.round(y - oy);
        const fall = (1 - s / L.r); const e = L.i * fall * fall * (L.spread < 1 ? 1 - Math.abs(k / (L.rays - 1) - 0.5) * 1.2 : 1) * 0.5;
        if (sx >= 0 && sy >= 0 && sx < VW && sy < VH) {
          const i = sy * VW + sx; lR[i] += e * L.col[0]; lG[i] += e * L.col[1]; lB[i] += e * L.col[2];
          // atmospheric beam: faint in-scatter in air so the cone is visible
          if (!solidMask[i]) { emR[i] += e * 0.05 * L.col[0]; emG[i] += e * 0.05 * L.col[1]; emB[i] += e * 0.05 * L.col[2]; }
        }
        if (SOLID[getM(x, y)]) break;
      }
    }
  }
  // 3. emissive glow (lava, sparks, lamps): blurred at full res, added as light
  for (let i = 0; i < N; i++) { sky[i] = emR[i]; }
  glowAdd(emR, lR, 1); glowAdd(emG, lG, 1); glowAdd(emB, lB, 1);

  // ---- compose ----
  for (let y = 0; y < VH; y++) for (let x = 0; x < VW; x++) {
    const i = y * VW + x, d = BAYER[(y & 3) * 4 + (x & 3)];
    let r = albR[i] * Math.min(1.6, lR[i]) + emR[i] * 120 + d;
    let g = albG[i] * Math.min(1.6, lG[i]) + emG[i] * 120 + d;
    let b = albB[i] * Math.min(1.6, lB[i]) + emB[i] * 120 + d;
    r = r < 0 ? 0 : r > 255 ? 255 : r; g = g < 0 ? 0 : g > 255 ? 255 : g; b = b < 0 ? 0 : b > 255 ? 255 : b;
    px32[i] = 0xff000000 | (b << 16) | (g << 8) | r;

}
// separable box blur of an emissive channel, added into a light channel
const tmpA = { buf: null };
function glowAdd(src, dst, gain) {
  const N = VW * VH;
  if (!tmpA.buf || tmpA.buf.length !== N) tmpA.buf = new Float32Array(N);
  const t = tmpA.buf, R = 6;
  for (let y = 0; y < VH; y++) {
    let acc = 0; const row = y * VW;
    for (let x = -R; x < VW; x++) { if (x + R < VW) acc += src[row + x + R]; if (x - R - 1 >= 0) acc -= src[row + x - R - 1]; if (x >= 0) t[row + x] = acc / (2 * R + 1); }
  }
  for (let x = 0; x < VW; x++) {
    let acc = 0;
    for (let y = -R; y < VH; y++) { if (y + R < VH) acc += t[(y + R) * VW + x]; if (y - R - 1 >= 0) acc -= t[(y - R - 1) * VW + x]; if (y >= 0) dst[y * VW + x] += acc / (2 * R + 1) * gain * 2.2; }
  }
}

// ---------------- audio (synthesised) ----------------
const audio = (() => {
  let ctx = null, eng = null, engGain = null, sub = null, filt = null;
  function unlock() {
    if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
    try {
      ctx = new AudioContext();
      const master = ctx.createGain(); master.gain.value = 0.45; master.connect(ctx.destination);
      eng = ctx.createOscillator(); eng.type = "sawtooth"; sub = ctx.createOscillator(); sub.type = "square";
      filt = ctx.createBiquadFilter(); filt.type = "lowpass"; filt.frequency.value = 600;
      engGain = ctx.createGain(); engGain.gain.value = 0;
      eng.connect(filt); sub.connect(filt); filt.connect(engGain); engGain.connect(master);
      eng.start(); sub.start();
      audio.master = master;
    } catch (e) { ctx = null; }
  }
  function noise(dur, f, q, peak, decay) {
    if (!ctx) return;
    const b = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * dur), ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, decay);
    const s = ctx.createBufferSource(); s.buffer = b;
    const fl = ctx.createBiquadFilter(); fl.type = "lowpass"; fl.frequency.value = f; fl.Q.value = q;
    const g = ctx.createGain(); g.gain.value = peak;
    s.connect(fl); fl.connect(g); g.connect(audio.master); s.start();
  }
  function tone(f0, f1, dur, peak, type = "square") {
    if (!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audio.master); o.start(t); o.stop(t + dur + 0.02);
  }
  let lastCoin = 0;
  return {
    unlock,
    engine(rpm, load) { if (!ctx) return; const t = ctx.currentTime; eng.frequency.setTargetAtTime(38 + rpm * 1.6, t, 0.05); sub.frequency.setTargetAtTime(19 + rpm * 0.8, t, 0.05); filt.frequency.setTargetAtTime(300 + load * 900 + rpm * 4, t, 0.05); engGain.gain.setTargetAtTime(0.05 + load * 0.12, t, 0.08); },
    silence() { if (ctx) engGain.gain.setTargetAtTime(0, ctx.currentTime, 0.1); },
    boom() { noise(1.2, 380, 0.8, 1.4, 2.2); tone(90, 30, 0.6, 0.5, "sine"); },
    crunch() { noise(0.4, 1500, 1, 0.8, 1.5); },
    coin() { if (!ctx || ctx.currentTime - lastCoin < 0.04) return; lastCoin = ctx.currentTime; tone(1320, 1980, 0.09, 0.08); },
    dig() { noise(0.08, 900, 0.5, 0.1, 1); },

})();

// ---------------- game flow ----------------
let state = "menu", acc = 0, last = performance.now(), toastT = 0;
const $ = id => document.getElementById(id);
function toast(s) { $("toast").textContent = s; $("toast").classList.add("on"); toastT = 1.6; }
function fmt(n) { return Math.floor(n).toLocaleString("en-US"); }

function reset() {
  ents.length = 0; debris.length = 0; fx.length = 0; flashes.length = 0;
  for (const k of [...chunks.keys()]) if (k > 4) chunks.delete(k);
  // regenerate the start so dug holes from the last run are gone
  for (const k of [...chunks.keys()]) chunks.delete(k);
  lastC = null;
  newCar(220);
  camX = car.x + 60; camY = car.y - 20;
}
function startRun() { audio.unlock(); reset(); state = "run"; $("menu").hidden = true; $("pads").hidden = !matchMedia("(pointer: coarse)").matches; auto = location.hash === "#auto"; }
function endRun() {
  state = "menu";
  const dist = (stats.maxX - stats.start) / 10;
  save.coins += stats.coins; if (dist > save.best) save.best = dist;
  persist(); audio.silence();
  menu(`${car.crash || (car.fuel <= 0 ? "OUT OF FUEL" : "RUN OVER")}`, dist);
}
function menu(title, dist) {
  $("menu").hidden = false; $("pads").hidden = true;
  if (title) $("tagline").textContent = title;
  $("runStats").innerHTML = dist === undefined
    ? `<div><span class="label">Coins</span><b>${fmt(save.coins)}</b></div><div><span class="label">Best</span><b>${fmt(save.best)} m</b></div><div><span class="label">World</span><b>5 biomes</b></div>`
    : `<div><span class="label">Distance</span><b>${fmt(dist)} m</b></div><div><span class="label">Coins</span><b>+${fmt(stats.coins)}</b></div><div><span class="label">Dug / craters</span><b>${fmt(stats.dug)} / ${stats.craters}</b></div>`;
  $("ups").innerHTML = Object.keys(UPG).map(k => {
    const u = UPG[k], lv = save.lv[k], maxed = lv >= u.max, c = cost(k);
    return `<button class="up" data-k="${k}" ${maxed || save.coins < c ? "disabled" : ""}><span class="n">${u.name}</span><span class="l">${u.desc}</span>
      <span class="pips">${Array.from({ length: u.max }, (_, i) => `<i class="${i < lv ? "f" : ""}"></i>`).join("")}</span>
      <span class="c">${maxed ? "maxed" : fmt(c) + " coins"}</span></button>`;
  }).join("");
  document.querySelectorAll(".up").forEach(b => b.onclick = () => { const k = b.dataset.k; if (save.coins >= cost(k) && save.lv[k] < UPG[k].max) { save.coins -= cost(k); save.lv[k]++; persist(); audio.unlock(); audio.coin(); menu(null, dist); } });
}
$("go").onclick = startRun;

// input
const keys = new Set();
addEventListener("keydown", e => {
  keys.add(e.key.toLowerCase());
  if ((e.key === "Enter" || e.key === " ") && state === "menu") { e.preventDefault(); startRun(); }
  if (e.key.toLowerCase() === "r" && state === "run") { car.dead = 0.01; car.crash = "RESTARTED"; }
});
addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
const pads = { gas: false, brake: false, boost: false };
for (const id of ["gas", "brake", "boost"]) {
  const el = $(id);
  const on = v => e => { e.preventDefault(); pads[id] = v; el.classList.toggle("on", v); audio.unlock(); };
  el.addEventListener("pointerdown", on(true)); el.addEventListener("pointerup", on(false)); el.addEventListener("pointercancel", on(false)); el.addEventListener("pointerleave", on(false));
}
function readInput() {
  if (auto || state === "menu") return autopilot();
  input.gas = keys.has("arrowright") || keys.has("d") || pads.gas ? 1 : 0;
  input.brake = keys.has("arrowleft") || keys.has("a") || pads.brake ? 1 : 0;
  input.nitro = keys.has("shift") || pads.boost ? 1 : 0;
}
// attract mode / QA: drives forward, levels the car in the air, avoids looping over
function autopilot() {
  const ahead = surfaceY(car.x + 14), behind = surfaceY(car.x - 14), slope = Math.atan2(ahead - behind, 28);
  const err = car.a - slope;
  if (car.ground) { input.gas = err < -0.55 ? 0 : 1; input.brake = err < -0.85 ? 1 : 0; }
  else { input.gas = err > 0.25 ? 1 : 0; input.brake = err < -0.25 ? 1 : 0; }
  input.nitro = car.ground && Math.abs(err) < 0.2 && car.nitro > car.nitroMax * 0.5 && Math.random() < 0.02 ? 1 : 0;
}

let fpsN = 0, fpsT = 0, fps = 0, simMs = 0, renderMs = 0;
function frameLoop(now) {
  const dtReal = Math.min(0.05, (now - last) / 1000); last = now;
  readInput();
  const t0 = performance.now();
  acc += dtReal;
  let n = 0;
  while (acc >= 1 / 60 && n < 3) {
    const dt = 1 / 60;
    time += dt;
    const sub = 6;
    for (let s = 0; s < sub; s++) stepCar(dt / sub);
    stepDebris(dt);
    stepCA(camX - VW / 2 - 64, camX + VW / 2 + 64);
    stepEnts(dt);
    for (const f of fx) { f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt; if (f.kind === "spark") f.vy += 300 * dt; if (f.kind === "smoke" || f.kind === "steam") f.vx *= 0.98; }
    for (let k = fx.length - 1; k >= 0; k--) if (fx[k].t >= fx[k].life) { fx[k] = fx[fx.length - 1]; fx.pop(); }
    for (const f of flashes) f.t += dt;
    for (let k = flashes.length - 1; k >= 0; k--) if (flashes[k].t >= flashes[k].life) flashes.splice(k, 1);
    shake *= 0.88;
    // fuel, lava, death
    if (state === "run" && !car.dead) {
      car.fuel -= dt * (1.6 + input.gas * 1.2) * (car.inLava ? 12 : 1);
      if (car.inLava && Math.random() < 0.6) fx.push({ x: car.x + (Math.random() - 0.5) * 30, y: car.y, vx: 0, vy: -40, life: 0.5, t: 0, kind: "flame" });
      if (car.fuel <= 0 && Math.hypot(car.vx, car.vy) < 8) { car.dead = 1.0; car.crash = car.inLava ? "MELTED" : "OUT OF FUEL"; }
    }
    if (car.dead) { car.dead -= dt; if (car.dead <= 0 && state === "run") endRun(); if (state === "menu" && car.dead <= 0) { newCar(car.x + 40); } }
    stats.maxX = Math.max(stats.maxX, car.x);
    // camera: lead in the direction of travel
    camX += (car.x + car.vx * 0.35 + 50 - camX) * 0.08; camY += (car.y + car.vy * 0.2 - 10 - camY) * 0.08;
    // forget the world far behind
    const keepFrom = Math.floor((camX - VW) / CW) - 2;
    for (const k of chunks.keys()) if (k < keepFrom) chunks.delete(k);
    for (let k = ents.length - 1; k >= 0; k--) if (ents[k].ch < keepFrom) ents.splice(k, 1);
    if (lastC && !chunks.has(lastC.ci)) lastC = null;
    acc -= dt; n++;
  }
  if (n === 3) acc = 0;
  simMs = performance.now() - t0;
  const t1 = performance.now();
  render(dtReal);
  renderMs = performance.now() - t1;
  // hud
  const rpm = Math.abs(car.wheels[1].w) * 10;
  if (state === "run") audio.engine(rpm, input.gas); else audio.silence();
  $("dist").firstChild.textContent = `${fmt((car.x - stats.start) / 10)} m`;
  $("best").textContent = `best ${fmt(save.best)} m`;
  $("coins").firstChild.textContent = fmt(save.coins + (state === "run" ? stats.coins : 0));
  $("speed").textContent = `${Math.round(Math.hypot(car.vx, car.vy) * 0.6)} km/h · ${biomeAt(car.x)}`;
  $("fuel").style.width = Math.max(0, car.fuel / car.fuelMax * 100) + "%";
  $("nitro").style.width = Math.max(0, car.nitro / car.nitroMax * 100) + "%";
  if (toastT > 0) { toastT -= dtReal; if (toastT <= 0) $("toast").classList.remove("on"); }
  fpsN++; fpsT += dtReal; if (fpsT > 1) { fps = fpsN; fpsN = 0; fpsT = 0; $("fps").textContent = `${fps} fps · sim ${simMs.toFixed(1)} ms · render ${renderMs.toFixed(1)} ms · ${VW}x${VH} · ${debris.length} debris`; }
  requestAnimationFrame(frameLoop);
}

reset();
menu();
window.__cr = { get car() { return car; }, get stats() { return stats; }, get state() { return state; }, startRun, explode, setAuto: v => { auto = v; }, perf: () => ({ fps, simMs, renderMs, debris: debris.length }), getM, surfaceY, jumpTo: x => { newCar(x); camX = car.x + 60; camY = car.y - 20; }, setTime: t => { time = t; } };
requestAnimationFrame(frameLoop);
</script>
